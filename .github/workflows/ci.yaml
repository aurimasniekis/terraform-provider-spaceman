name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: auto

jobs:
  go:
    name: go (lint, vet, unit tests, docs drift)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The contract test compares the Telegram settings schemas with SpaceMan's OpenAPI document. Pinned to the commit
      # of SpaceMan release v0.1.7 (public repository): its Telegram API is the one this provider implements, including
      # group_chat_id. Move the pin only together with the provider's Telegram schemas.
      - name: checkout SpaceMan (OpenAPI contract)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aurimasniekis/go-spaceman
          ref: 6dd25790f3dddb70b13a3af77a300d54beae4422 # v0.1.7
          path: spaceman-src
          persist-credentials: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - name: unit tests and docs drift
        # Acceptance tests (make acc) need Terraform >= 1.11 and a SpaceMan checkout; they run locally.
        run: make test
        env:
          SPACEMAN_SRC: ${{ github.workspace }}/spaceman-src
          # A missing checkout or API operation fails the contract test instead of skipping it.
          SM_REQUIRE_OPENAPI: "1"
      # Known vulnerabilities that the provider's code reaches (as SpaceMan's CI checks its own).
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
